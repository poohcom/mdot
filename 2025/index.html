<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>테트리스 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* 동적 뷰포트 높이 사용 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: relative;
            overflow-y: auto;
            padding: 10px 0;
            box-sizing: border-box;
        }

        #game-canvas {
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            background: #1a1a2e;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            max-height: calc(100dvh - 200px);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.3);
        }

        .info {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .score {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .level {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .lines {
            font-size: 16px;
        }

        @media (max-width: 768px) {
            #game-container {
                padding: 5px 0 80px 0;
                justify-content: flex-start;
            }

            .controls {
                position: fixed;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                width: 95%;
                max-width: 400px;
                z-index: 100;
            }

            .btn {
                flex: 1;
                min-width: 60px;
                font-size: 12px;
                padding: 8px 12px;
            }

            .info {
                margin-top: 10px;
                margin-bottom: 10px;
                font-size: 14px;
            }

            .score {
                font-size: 18px;
            }

            .level {
                font-size: 16px;
            }

            .lines {
                font-size: 14px;
            }

            #game-canvas {
                max-height: calc(100vh - 250px);
                max-height: calc(100dvh - 250px);
            }
        }
    </style>
  <script src="./assets/index.js"></script>
</head>
<body>
    <div id="game-container">
        <div class="info">
            <div class="score">점수: <span id="score">0</span></div>
            <div class="level">레벨: <span id="level">1</span></div>
            <div class="lines">줄: <span id="lines">0</span></div>
        </div>
        <canvas id="game-canvas"></canvas>
        <div class="controls">
            <button class="btn" id="btn-left">←</button>
            <button class="btn" id="btn-rotate">↻</button>
            <button class="btn" id="btn-right">→</button>
            <button class="btn" id="btn-down">↓</button>
            <button class="btn" id="btn-pause">일시정지</button>
        </div>
    </div>
</body>
</html>
